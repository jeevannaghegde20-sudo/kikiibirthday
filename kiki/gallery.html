<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Kiki's Beautiful Memories 💖🦋</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      background: radial-gradient(circle at 20% 30%, #ffe6f0, #ffccdd, #ffb3c6);
      padding: 40px 20px;
      position: relative;
      overflow-x: hidden;
    }

    .orb {
      position: fixed;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,200,0.3), rgba(255,200,150,0));
      pointer-events: none;
      z-index: 0;
      animation: floatOrb 12s infinite ease-in-out;
    }
    @keyframes floatOrb {
      0% { transform: translateY(0px) scale(1); opacity: 0.4; }
      50% { transform: translateY(-40px) scale(1.1); opacity: 0.7; }
      100% { transform: translateY(0px) scale(1); opacity: 0.4; }
    }

    .butterfly {
      position: fixed;
      font-size: 32px;
      pointer-events: none;
      z-index: 1;
      animation: flyButterfly 18s linear infinite;
      filter: drop-shadow(0 0 4px #00b4d8);
    }
    @keyframes flyButterfly {
      0% { transform: translateX(-10vw) translateY(10vh) rotate(0deg); opacity: 0.9; }
      50% { transform: translateX(60vw) translateY(-5vh) rotate(20deg); }
      100% { transform: translateX(110vw) translateY(15vh) rotate(40deg); opacity: 0; }
    }
    .butterfly:nth-child(1) { top: 15%; animation-duration: 20s; animation-delay: 0s; }
    .butterfly:nth-child(2) { top: 45%; animation-duration: 25s; animation-delay: 3s; }
    .butterfly:nth-child(3) { top: 70%; animation-duration: 18s; animation-delay: 7s; }
    .butterfly:nth-child(4) { top: 85%; animation-duration: 22s; animation-delay: 2s; }

    .gallery-container {
      position: relative;
      z-index: 10;
      max-width: 1200px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      font-size: 48px;
      font-weight: 900;
      background: linear-gradient(135deg, #ff4d6d, #ffb347, #ffd166);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 20px;
    }

    .sub {
      text-align: center;
      font-size: 20px;
      font-weight: 600;
      color: #c44569;
      margin-bottom: 40px;
      background: rgba(255,255,240,0.7);
      display: inline-block;
      padding: 6px 20px;
      border-radius: 40px;
      backdrop-filter: blur(4px);
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 35px;
      margin-bottom: 50px;
    }

    .polaroid {
      background: rgba(255, 250, 240, 0.96);
      padding: 15px 15px 25px 15px;
      border-radius: 20px 20px 25px 25px;
      box-shadow: 0 20px 30px rgba(0,0,0,0.2);
      transition: all 0.3s ease;
      transform: rotate(var(--rot, 0deg));
      cursor: pointer;
      backdrop-filter: blur(2px);
      border: 1px solid rgba(255,215,0,0.5);
    }

    .polaroid:hover {
      transform: rotate(0deg) translateY(-12px);
      box-shadow: 0 30px 40px rgba(0,0,0,0.3);
    }

    .polaroid:nth-child(1) { --rot: -1.5deg; }
    .polaroid:nth-child(2) { --rot: 2deg; }
    .polaroid:nth-child(3) { --rot: -1deg; }
    .polaroid:nth-child(4) { --rot: 1.8deg; }
    .polaroid:nth-child(5) { --rot: -2deg; }
    .polaroid:nth-child(6) { --rot: 1.2deg; }

    .polaroid-img {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border-radius: 12px;
      display: block;
      background: #ffe0b5;
    }

    .caption {
      font-size: 20px;
      font-weight: 800;
      margin: 12px 0 6px;
      color: #ff4d6d;
      text-align: center;
    }

    .memory-note {
      font-size: 14px;
      font-weight: 500;
      color: #4a4e69;
      text-align: center;
      line-height: 1.4;
      padding: 0 8px;
      background: rgba(255,240,210,0.5);
      border-radius: 30px;
      margin-top: 8px;
    }

    .heart-icon {
      display: inline-block;
      margin-top: 8px;
      font-size: 18px;
      color: #ff4d6d;
      animation: heartbeat 1.2s infinite;
    }

    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.2); }
    }

    /* NEXT BUTTON (to letter.html) */
    .next-btn {
      display: block;
      width: fit-content;
      margin: 20px auto 10px;
      padding: 14px 32px;
      background: linear-gradient(135deg, #b97f44, #e0a878);
      border: none;
      border-radius: 60px;
      color: white;
      font-size: 20px;
      font-weight: bold;
      text-decoration: none;
      text-align: center;
      transition: 0.2s;
      box-shadow: 0 8px 18px rgba(0,0,0,0.2);
    }

    .next-btn:hover {
      transform: scale(1.03);
      background: linear-gradient(135deg, #9b5e2c, #c2814a);
    }

    #sparkleCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 999;
    }

    @media (max-width: 700px) {
      h1 { font-size: 36px; }
      .gallery-grid { gap: 25px; }
      .polaroid { padding: 10px 10px 18px; }
      .caption { font-size: 18px; }
    }
  </style>
</head>
<body>

<div class="orb" style="width: 200px; height: 200px; bottom: 10%; left: -50px;"></div>
<div class="orb" style="width: 300px; height: 300px; top: 20%; right: -80px;"></div>
<div class="orb" style="width: 150px; height: 150px; bottom: 30%; left: 70%;"></div>
<div class="orb" style="width: 250px; height: 250px; top: 60%; left: 10%;"></div>

<div class="butterfly">🦋</div>
<div class="butterfly">🦋</div>
<div class="butterfly">🦋</div>
<div class="butterfly">🦋</div>

<canvas id="sparkleCanvas"></canvas>

<div class="gallery-container">
  <h1>✨ Kiki's Beautiful Memories ✨</h1>
  <div style="text-align: center;">
    <div class="sub">💖 a little gallery of your glow 💖</div>
  </div>

  <div class="gallery-grid" id="galleryGrid"></div>

  <!-- REPLACED: Next Celebration button -> goes to letter.html -->
  <a href="letter.html" class="next-btn">💌 Next Celebration →</a>
</div>

<script>
  // ---------- YOUR 6 PHOTOS + NOTES (EDIT HERE) ----------
  const memories = [
    {
      img: "memory1.jpg",
      caption: "✨ That Smile ✨",
      note: "That smile… I don’t think you even realize what it does to me. It’s not just beautiful… it feels peaceful, like everything slows down for a moment. Somewhere between that look and that smile, my heart quietly decided to stay there ❤️"
    },
    {
      img: "memory2.jpg",
      caption: "🌻 Sunshine Days",
      note: "You and those flowers… honestly, I couldn’t tell which one looked more beautiful 🌸 But what I do know is, you have this way of bringing light into everything around you… like even the dullest days feel brighter when you’re in them 💛"
    },
    {
      img: "memory3.jpg",
      caption: "🌸 Pure Magic",
      note: "Just you… in your own little world, and somehow that becomes my favorite place to be 🤍 It’s in moments like this I realize, I don’t need anything extraordinary… just you, being you, is already enough ✨"
    },
    {
      img: "memory4.jpg",
      caption: "💫 Stolen Glance",
      note: "That moment felt different… with all the lights around, it somehow became calm. Maybe because you were there, and everything just felt right 🤍"
    },
    {
      img: "memory5.jpg",
      caption: "🍰 Sweetest Soul",
      note: "That smile looks simple to everyone, but I know the story behind it 🙂 And honestly, I’m just glad I was there 💛"
    },
    {
      img: "memory6.jpg",
      caption: "🦋 Forever You",
      note: "That little “sorry” meant more than you think 🤍 Not because of the word, but because it came from you. Some bonds just stay… no matter what 🦋"
    }
  ];

  const grid = document.getElementById("galleryGrid");

  memories.forEach((mem, idx) => {
    const polaroid = document.createElement("div");
    polaroid.className = "polaroid";
    polaroid.setAttribute("data-idx", idx);

    const img = document.createElement("img");
    img.className = "polaroid-img";
    img.src = mem.img;
    img.alt = mem.caption;
    img.onerror = function() {
      this.src = "https://via.placeholder.com/400x400?text=🌸+Kiki+🌸";
      this.style.objectFit = "cover";
    };

    const captionDiv = document.createElement("div");
    captionDiv.className = "caption";
    captionDiv.innerText = mem.caption;

    const noteDiv = document.createElement("div");
    noteDiv.className = "memory-note";
    noteDiv.innerHTML = `💬 ${mem.note}`;

    const heartDiv = document.createElement("div");
    heartDiv.className = "heart-icon";
    heartDiv.innerText = "❤️";

    polaroid.appendChild(img);
    polaroid.appendChild(captionDiv);
    polaroid.appendChild(noteDiv);
    polaroid.appendChild(heartDiv);

    polaroid.addEventListener("click", (e) => {
      e.stopPropagation();
      createSparkle(e.clientX, e.clientY);
      polaroid.style.transform = "scale(0.98)";
      setTimeout(() => { polaroid.style.transform = ""; }, 150);
    });

    grid.appendChild(polaroid);
  });

  // ---------- SPARKLE EFFECT ----------
  const canvas = document.getElementById("sparkleCanvas");
  const ctx = canvas.getContext("2d");
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  window.addEventListener("resize", () => {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  });

  let sparkles = [];
  function createSparkle(x, y) {
    for (let i = 0; i < 25; i++) {
      sparkles.push({
        x: x,
        y: y,
        vx: (Math.random() - 0.5) * 8,
        vy: (Math.random() - 0.5) * 8 - 2,
        alpha: 1,
        size: Math.random() * 4 + 2,
        color: `hsl(${Math.random() * 60 + 330}, 100%, 65%)`
      });
    }
  }

  function drawSparkles() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (let i = sparkles.length - 1; i >= 0; i--) {
      let s = sparkles[i];
      s.x += s.vx;
      s.y += s.vy;
      s.vy += 0.2;
      s.alpha -= 0.02;
      if (s.alpha <= 0) {
        sparkles.splice(i, 1);
        continue;
      }
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
      ctx.fillStyle = s.color;
      ctx.globalAlpha = s.alpha;
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    requestAnimationFrame(drawSparkles);
  }
  drawSparkles();

  window.addEventListener("load", () => {
    for (let i = 0; i < 30; i++) {
      setTimeout(() => {
        createSparkle(Math.random() * window.innerWidth, Math.random() * window.innerHeight);
      }, i * 50);
    }
  });
</script>
</body>
</html>
